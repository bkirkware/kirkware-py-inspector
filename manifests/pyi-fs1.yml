---
# pyi-fs1 — python_buildpack on tanzucflinuxfs1 (cody)
# Route: pyi-fs1.apps.tanzu.kirkware.net
applications:
- name: pyi-fs1
  memory: 128M
  disk_quota: 1G
  instances: 3
  stack: tanzucflinuxfs1
  buildpacks:
    - python_buildpack
  command: python3 main.py
  routes:
    - route: pyi-fs1.apps.tanzu.kirkware.net
  # Where this app is stored. CF droplets drop .git, so the app reads these
  # from the environment; deploy.sh stamps the live values at push time.
  env:
    GIT_REPO_URL: "https://github.com/bkirkware/kirkware-py-inspector.git"
    GIT_COMMIT: "unknown"
    BUILDPACK_NAME: ""
    BUILDPACK_VERSION: ""
    APP_STACK: ""
